name: release

# Every merge to main ships a release: the patch version is bumped, tagged,
# built and published as a GitHub Release. The bump commit is pushed back to
# main, so the repository version always matches the newest release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Releases are serialised. A stale or wedged run (for example one waiting on a
# hung test) is superseded by the next merge instead of blocking it forever.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The version-bump commit is marked [skip release] so it cannot trigger a
    # release of its own. (A GITHUB_TOKEN push does not start workflows anyway;
    # this also covers manual dispatch and re-runs.)
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Bump patch version
        id: bump
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import subprocess

          init = pathlib.Path("heduvpn/__init__.py")
          text = init.read_text()
          match = re.search(r'__version__\s*=\s*"([^"]+)"', text)
          if not match:
              raise SystemExit("could not find __version__ in heduvpn/__init__.py")

          current = match.group(1)
          major, minor, patch = (int(part) for part in current.split(".")[:3])

          # Never reuse a tag that already exists (e.g. a release run was
          # cancelled after tagging but before publishing).
          tags = subprocess.run(
              ["git", "tag", "--list"], capture_output=True, text=True, check=True
          ).stdout.split()
          while f"v{major}.{minor}.{patch + 1}" in tags:
              patch += 1

          nxt = f"{major}.{minor}.{patch + 1}"
          init.write_text(
              text.replace(f'__version__ = "{current}"', f'__version__ = "{nxt}"', 1)
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"current={current}\n")
              fh.write(f"next={nxt}\n")

          print(f"Bumped version {current} -> {nxt}")
          PY

      - name: Build distributions
        run: python -m build

      - name: Smoke-test the built wheel
        env:
          VERSION: ${{ steps.bump.outputs.next }}
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet "dist/heduvpn-${VERSION}-py3-none-any.whl"
          /tmp/smoke/bin/python -c "import heduvpn, sys; sys.exit(0 if heduvpn.__version__ == '${VERSION}' else 1)"
          /tmp/smoke/bin/heduvpn --version | grep -qx "HeduVPN ${VERSION}"
          /tmp/smoke/bin/heduvpn --help > /dev/null

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.bump.outputs.next }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heduvpn/__init__.py
          git commit -m "chore(release): v${VERSION} [skip release]"
          git tag -a "v${VERSION}" -m "HeduVPN v${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v${VERSION}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.next }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            dist/* \
            --title "HeduVPN v${VERSION}" \
            --generate-notes \
            --verify-tag
