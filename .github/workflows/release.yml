name: release

# Every push to main (i.e. every merged pull request) ships a release:
# the patch version is bumped, tagged, built and published as a GitHub Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never let two releases race each other on the same version number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # The version-bump commit this workflow pushes is marked [skip release] so
    # it cannot trigger itself (a GITHUB_TOKEN push already skips workflows,
    # this is belt and braces for re-runs and manual dispatches).
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' build

      # Do not ship a release that fails its own test suite.
      - name: Tests
        run: python -m pytest -q

      - name: Bump patch version
        id: bump
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          init = pathlib.Path("heduvpn/__init__.py")
          text = init.read_text()
          match = re.search(r'__version__\s*=\s*"([^"]+)"', text)
          if not match:
              raise SystemExit("could not find __version__ in heduvpn/__init__.py")

          current = match.group(1)
          major, minor, patch = (int(part) for part in current.split(".")[:3])
          nxt = f"{major}.{minor}.{patch + 1}"

          init.write_text(
              text.replace(f'__version__ = "{current}"', f'__version__ = "{nxt}"', 1)
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"current={current}\n")
              fh.write(f"next={nxt}\n")

          print(f"Bumped version {current} -> {nxt}")
          PY

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.bump.outputs.next }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heduvpn/__init__.py
          git commit -m "chore(release): v${VERSION} [skip release]"
          git tag -a "v${VERSION}" -m "HeduVPN v${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v${VERSION}"

      - name: Build distributions
        env:
          VERSION: ${{ steps.bump.outputs.next }}
        run: |
          set -euo pipefail
          python -m build
          ls -l dist/
          test -f "dist/heduvpn-${VERSION}.tar.gz"
          test -f "dist/heduvpn-${VERSION}-py3-none-any.whl"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.next }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            dist/* \
            --title "HeduVPN v${VERSION}" \
            --generate-notes \
            --verify-tag
