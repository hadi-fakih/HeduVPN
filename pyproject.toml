[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heduvpn"
dynamic = ["version"]
description = "A self-hosted, censorship-resistant VPN that looks like an ordinary HTTPS website"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "hadi-fakih" }]
keywords = ["vpn", "anticensorship", "tls", "websocket", "dpi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Security",
]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[project.scripts]
heduvpn = "heduvpn.cli:main"

[project.urls]
Homepage = "https://github.com/hadi-fakih/HeduVPN"

[tool.setuptools]
packages = ["heduvpn", "heduvpn.gui"]

[tool.setuptools.dynamic]
version = { attr = "heduvpn.__version__" }

[tool.setuptools.package-data]
heduvpn = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Any single test that blocks this long is a bug (deadlock, missing timeout).
# Requires pytest-timeout (in the "dev" extra); ignored when it is absent.
timeout = 120
timeout_method = "thread"

